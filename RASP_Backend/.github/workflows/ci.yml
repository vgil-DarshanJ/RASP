# Backend CI (F-28): type check, unit tests, migrations and the raw-SQL
# integration test on PostgreSQL 16, dependency audit.
# The database credentials below belong to the throwaway service container
# of this job only; they are not secrets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rasp_ci
          POSTGRES_PASSWORD: rasp_ci_only
          POSTGRES_DB: rasp_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rasp_ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rasp_ci:rasp_ci_only@localhost:5432/rasp_ci?schema=public
      TEST_DATABASE_URL: postgresql://rasp_ci:rasp_ci_only@localhost:5432/rasp_ci?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        run: npm test

      - name: Migrations on an empty database
        run: npx prisma migrate deploy

      - name: Raw-SQL integration test (PostgreSQL)
        run: npm run test:db

      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high
