# Production stack (WP-13): HTTPS proxy + dashboard, backend, PostgreSQL,
# Redis, daily database backups. Only ports 80 and 443 are published.
#
#   cp deploy/production.env.example deploy/production.env   # then fill it in
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/production.env up -d --build
#
# Expects the dashboard repository next to this one (../FE), as on the
# development machine. See deploy/README.md.
name: rasp-shield

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: rasp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in production.env}
      POSTGRES_DB: rasp_shield
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rasp -d rasp_shield"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - production.env
    environment:
      DATABASE_URL: postgresql://rasp:${POSTGRES_PASSWORD}@postgres:5432/rasp_shield?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      PORT: "4444"
      TRUST_PROXY: "1"
      PUBLIC_INGESTION_URL: https://${DOMAIN:?set DOMAIN in production.env}/v1/events
      CORS_ORIGINS: https://${DOMAIN}
      DASHBOARD_URL: https://${DOMAIN}
      REPUTATION_LIST_PATH: /reputation/list.json
    volumes:
      - ./reputation:/reputation:ro

  proxy:
    build:
      context: ../../FE
      dockerfile: Dockerfile
      args:
        PUBLIC_ORIGIN: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in production.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    # One compressed dump a day; dumps older than BACKUP_KEEP_DAYS are removed.
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          f=/backups/rasp_shield_$$(date -u +%Y%m%dT%H%M%SZ).dump
          pg_dump -h postgres -U rasp -d rasp_shield -Fc -f "$$f.tmp" && mv "$$f.tmp" "$$f" && echo "backup $$f"
          find /backups -name 'rasp_shield_*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep 86400
        done

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
